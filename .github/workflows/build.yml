name: Build ABL

on:
  push:
  workflow_dispatch:   # cho phép bấm "Run workflow" thủ công

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ clang lld llvm nasm acpica-tools \
            uuid-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 python-is-python3 python3-distutils \
            xxd git bison flex

      - name: Show versions
        run: |
          clang --version | head -1
          aarch64-linux-gnu-ld --version | head -1
          python --version

      - name: Build
        run: |
          set -o pipefail
          make build 2>&1 | tee build_output.log

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ABL_output
          path: |
            dist/ABL_with_superfastboot.efi
            dist/ABL.efi
            dist/patch_log.txt
            build_output.log
          if-no-files-found: warn
